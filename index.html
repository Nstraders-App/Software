/* Each plan carries copies of its customer's recoveryId / addedBy / approval so Security Rules can check them */
function docFor(k,o){o=clean(o);if(k=='users')delete o.password;if(k=='installments'){const c=APP.DB.customers.find(x=>x.id==o.customerId)||{};Object.assign(o,clean({recoveryId:c.recoveryId||'',addedBy:c.addedBy||'',approval:c.approval||'approved'}))}return o}
async function run(k,list){const seen=new Set();for(const o of list){const d=docFor(k,o),j=sj(d);seen.add(o.id);if(last[k][o.id]!==j){if(ROLE=='recovery'&&k=='installments'&&last[k][o.id]!==undefined){const pj=sj(d.payments||[]);if(pj!==last.pay[o.id]){await updateDoc(doc(db,k,o.id),{payments:d.payments});last.pay[o.id]=pj}else if(d.approval!='approved')await setDoc(doc(db,k,o.id),d)}else await setDoc(doc(db,k,o.id),d);last[k][o.id]=j}}
for(const id of Object.keys(last[k]))if(!seen.has(id)){await deleteDoc(doc(db,k,id));delete last[k][id]}}
window.FBsync=(k,old,nv)=>{Q=Q.then(async()=>{await run(k,nv);if(k=='customers')await run('installments',APP.DB.installments)}).catch(e=>{console.error(e);APP.toast('Save failed: '+(e.code||e.message))})};
function listen(u,role){unsubs.forEach(x=>x());unsubs=[];const col=n=>collection(db,n),src={};
if(role!='sales')unsubs.push(onSnapshot(doc(db,'meta','accounts'),s=>{APP.ACC=s.exists()?(s.data().used||[]):[]},()=>{}));
/* admin: everything · recovery man: his approved customers + customers he added himself · salesman: customers he added */
const qs=n=>role=='admin'?[col(n)]:role=='recovery'?[query(col(n),where('recoveryId','==',u.uid),where('approval','==','approved')),query(col(n),where('addedBy','==',u.uid))]:[query(col(n),where('addedBy','==',u.uid))];
const take=(n,i,s)=>{(src[n]=src[n]||{})[i]=s.docs;const m=new Map();Object.values(src[n]).forEach(a=>a.forEach(d=>m.set(d.id,d)));const ds=[...m.values()];APP.DB[n]=ds.map(d=>({...d.data(),id:d.id}));last[n]=Object.fromEntries(ds.map(d=>[d.id,sj(clean(d.data()))]));if(n=='installments')last.pay=Object.fromEntries(ds.map(d=>[d.id,sj(d.data().payments||[])]));kick()};
for(const n of['customers','installments'])qs(n).forEach((q,i)=>unsubs.push(onSnapshot(q,s=>take(n,i,s),loadErr)));
if(role=='admin')unsubs.push(onSnapshot(col('users'),s=>take('users',0,s),loadErr));
/* recovery man also needs the salesmen list (for the "who brought this customer" dropdown) */
if(role=='recovery')unsubs.push(onSnapshot(query(col('users'),where('role','==','sales')),s=>{APP.DB.users=[APP.DB.users.find(x=>x.id==u.uid),...s.docs.map(d=>({...d.data(),id:d.id}))].filter(Boolean);kick()},loadErr))}
onAuthStateChanged(auth,async u=>{unsubs.forEach(x=>x());unsubs=[];
if(!u){conn.textContent='';errs.clear();APP.setSess(null);Object.assign(APP.DB,{users:[],customers:[],installments:[]});APP.render();return}
try{const s=await getDoc(doc(db,'users',u.uid));if(!s.exists()){APP.toast('Account has no profile. Ask the admin.');await signOut(auth);return}
const me={...s.data(),id:u.uid};if(!['admin','recovery','sales'].includes(me.role)){alert('Profile role is "'+me.role+'".\nIt must be exactly: admin, recovery or sales (small letters, no spaces).\nFix the "role" field in Firestore, users, document '+u.uid);await signOut(auth);return}ROLE=me.role;APP.DB.users=[me];APP.setSess({userId:u.uid,role:me.role});APP.ui.view={admin:'dash',sales:'mine'}[me.role]||'today';listen(u,me.role);conn.style.color='#6b7280';conn.textContent=VER+' · ⏳ '+firebaseConfig.projectId+' · loading data…';APP.render()}
catch(e){APP.toast('Login error: '+(e.code||e.message));await signOut(auth)}});
window.FB={
 async login(id,pw){if(!id||!pw)return APP.toast('Enter username and password');const em=id.includes('@')?id:id.toLowerCase()+'@'+DOMAIN;try{await signInWithEmailAndPassword(auth,em,pw)}catch(e){console.error(e);alert('Login failed\n\nError: '+(e.code||e.message)+'\nEmail tried: '+em+'\nFirebase project: '+firebaseConfig.projectId)}},
 logout(){signOut(auth)},
 async changePass(o,n){if(n.length<6)return APP.toast('New password: min 6 characters');try{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,o));await updatePassword(u,n);closeM();APP.toast('Password changed')}catch(e){APP.toast('Current password is wrong')}},
 async claimAccount(no,old){const ref=doc(db,'meta','accounts');try{await runTransaction(db,async tx=>{const s=await tx.get(ref),used=s.exists()?(s.data().used||[]).map(Number):[];if(used.includes(no))throw new Error('USED');let nu=[...used,no];if(ROLE=='admin'&&old)nu=nu.filter(x=>x!=+old);tx.set(ref,{used:nu})});return'ok'}catch(e){return e.message=='USED'?'used':(e.code||e.message)}},
 async createUser(p,pw){try{const a2=getAuth(initializeApp(firebaseConfig,'sec'+Date.now())),un=p.username.toLowerCase(),c=await createUserWithEmailAndPassword(a2,un+'@'+DOMAIN,pw);await signOut(a2);await setDoc(doc(db,'users',c.user.uid),{...p,username:un});closeM();APP.toast('User created')}catch(e){APP.toast(e.code=='auth/email-already-in-use'?'This username already exists in Firebase':'Error: '+(e.code||e.message))}}
};
</script>
</body></html>
